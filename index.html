<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffcf33">
<title>Álbum Gamer do Dudu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE occasion: brincalhão, para um menino de 10 anos, mas limpo e fácil de usar no celular
   IDEA álbum de figurinhas: cada jogo é uma figurinha que ele "cola" quando testa
   PICTURE as páginas do álbum: 5 mundos com barra de progresso e figurinhas coloridas por mundo
   COLOUR paleta fixa: fundo amarelo-sol de álbum, tinta quase preta, um vermelho/laranja/verde/azul/magenta por mundo
   TYPE Lilita One (títulos, como capa de álbum) + Nunito (texto)
   LAYOUT faixa do jogador no topo, abas fixas, conteúdo em grade; no celular tudo em uma coluna */
:root{color-scheme:light;--sun:#ffcf33;--paper:#fff8dc;--ink:#1d1a14;--soft:#5b5345;--line:#e8d9a8;--card:#ffffff}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.disp{font-family:"Lilita One",Impact,sans-serif;font-weight:400;letter-spacing:.01em;line-height:1.05;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.top{background:var(--sun);padding:18px max(16px,4vw) 14px;border-bottom:4px solid var(--ink)}
.toprow{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;max-width:1100px;margin:0 auto}
.top h1{font-size:clamp(30px,6vw,46px)}
.top h1 small{display:block;font-family:Nunito,sans-serif;font-weight:800;font-size:15px;color:var(--soft);margin-top:4px}
.player{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--sun);padding:10px 16px 10px 10px;border-radius:999px}
.lvl{width:52px;height:52px;border-radius:50%;background:var(--sun);color:var(--ink);display:grid;place-items:center;font-family:"Lilita One",sans-serif;font-size:24px;flex:none}
.player b{display:block;font-size:16px;color:#fff}
.player span{font-size:13px;font-weight:700}
.xpbar{max-width:1100px;margin:12px auto 0;height:16px;background:#fff;border:3px solid var(--ink);border-radius:99px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#2a9d8f,#1d4ed8);transition:width .6s ease}
.xptxt{max-width:1100px;margin:4px auto 0;font-size:13px;font-weight:800;display:flex;justify-content:space-between}
.tabs{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:2px solid var(--line);display:flex;justify-content:center;gap:6px;padding:8px 12px}
.tabs button{flex:1;max-width:220px;min-height:46px;border-radius:14px;font-weight:900;font-size:16px;border:3px solid transparent}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--sun)}
.tabs em{font-style:normal;background:#d62828;color:#fff;border-radius:99px;padding:0 7px;font-size:13px;margin-left:4px}
main{max-width:1100px;margin:0 auto;padding:18px max(16px,3vw) 60px}
.worlds{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr));gap:12px}
.world{position:relative;text-align:left;border-radius:18px;padding:14px 14px 12px;color:#fff;background:var(--wc);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);overflow:hidden;min-height:132px;transition:transform .12s}
.world:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.world[aria-pressed=true]{outline:4px solid var(--ink);outline-offset:3px}
.world svg{position:absolute;right:-6px;bottom:-8px;width:92px;height:92px;color:#fff;opacity:.35}
.world h3{font-size:21px;max-width:75%;position:relative}
.world p{margin:6px 0 8px;font-weight:800;font-size:14px;position:relative}
.prog{position:relative;height:10px;background:rgba(0,0,0,.25);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:#fff;border-radius:99px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:22px 0 12px}
.bar h2{font-size:28px;margin-right:auto}
.chip{min-height:40px;padding:0 14px;border-radius:99px;border:2px solid var(--ink);font-weight:800;font-size:14px;background:#fff}
.chip[aria-pressed=true]{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(158px,100%),1fr));gap:14px}
.card{position:relative;text-align:left;background:var(--card);border:3px solid var(--ink);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 4px 0 var(--ink)}
.art{position:relative;height:104px;background:var(--wc);overflow:hidden}
.art::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.12) 0 10px,transparent 10px 22px)}
.art svg{position:absolute;right:-4px;bottom:-6px;width:78px;height:78px;color:#fff;opacity:.9}
.art .mono{position:absolute;left:10px;top:6px;font-family:"Lilita One",sans-serif;font-size:42px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.card .nm{padding:8px 10px 2px;font-weight:900;font-size:15px;line-height:1.2}
.card .meta{padding:2px 10px 10px;display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.tag{font-size:12px;font-weight:900;padding:2px 8px;border-radius:99px;background:#f1ead2;white-space:nowrap}
.tag.m{background:#1d4ed8;color:#fff}.tag.t{background:#2a9d8f;color:#fff}.tag.d{background:#d62828;color:#fff}
.card.done .art{filter:none}
.card:not(.done) .art{filter:saturate(.75)}
.stamp{position:absolute;top:8px;right:8px;background:#fff;color:#2a9d8f;border:3px solid #2a9d8f;font-family:"Lilita One",sans-serif;font-size:14px;padding:1px 8px;border-radius:8px;transform:rotate(8deg)}
.empty{background:#fff;border:3px dashed var(--line);border-radius:16px;padding:22px;text-align:center;font-weight:700;color:var(--soft)}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:14px}
.slot{border:3px dashed var(--ink);border-radius:18px;min-height:150px;padding:14px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-weight:800;color:var(--soft);background:#fff}
.slot.full{border-style:solid;background:var(--wc);color:#fff;align-items:flex-start;text-align:left;justify-content:space-between}
.slot.full h3{font-size:22px}
.slot .go{background:#fff;color:var(--ink);border-radius:12px;min-height:44px;padding:0 14px;font-weight:900;margin-top:10px}
.list{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;width:100%}
.dot{width:14px;height:14px;border-radius:50%;background:var(--wc);flex:none}
.row b{flex:1}
.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,100%),1fr));gap:14px}
.medal{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:14px 10px;text-align:center}
.medal svg{width:64px;height:64px}
.medal h3{font-size:17px;margin-top:6px}
.medal p{margin:4px 0 0;font-size:13px;font-weight:700;color:var(--soft)}
.medal.off{border-style:dashed;border-color:#b9ad8a;background:transparent}
.medal.off svg{filter:grayscale(1);opacity:.35}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--ink);color:#fff;border-radius:16px;padding:12px 14px}
.stat b{display:block;font-family:"Lilita One",sans-serif;font-size:34px;color:var(--sun);line-height:1}
.stat span{font-size:13px;font-weight:800}
.ov{position:fixed;inset:0;background:rgba(29,26,20,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--paper);width:min(640px,100%);max-height:92%;overflow:auto;border-radius:24px 24px 0 0;border:3px solid var(--ink);border-bottom:0}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:24px;border-bottom:3px solid var(--ink)}}
.shead{position:relative;background:var(--wc);color:#fff;padding:20px 20px 18px;overflow:hidden}
.shead svg{position:absolute;right:-10px;bottom:-14px;width:130px;height:130px;opacity:.3;color:#fff}
.shead h2{font-size:30px;position:relative;max-width:85%}
.shead p{margin:6px 0 0;font-weight:800;position:relative}
.x{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.25);color:#fff;font-size:22px;font-weight:900;z-index:2}
.sbody{padding:18px 20px 24px}
.pitch{font-size:18px;font-weight:800;line-height:1.4;margin:0 0 14px}
.info{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px;margin:0 0 16px}
.info dt{font-weight:900}
.info dd{margin:0}
.chal{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:12px 14px;margin-bottom:16px}
.chal b{font-family:"Lilita One",sans-serif;font-weight:400;font-size:18px;display:block}
.acts{display:grid;gap:10px}
.big{min-height:52px;border-radius:14px;font-weight:900;font-size:17px;border:3px solid var(--ink);background:#fff;box-shadow:0 4px 0 var(--ink)}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.big.on{background:var(--ink);color:var(--sun)}
.big[disabled]{opacity:.45;box-shadow:none;cursor:default}
.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rate button{min-height:46px;border-radius:12px;border:2px solid var(--ink);font-weight:900;background:#fff}
.rate button[aria-pressed=true]{background:#2a9d8f;color:#fff}
.store{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:14px;background:#107c10;color:#fff;font-weight:900;text-decoration:none}
.hint{font-size:13px;color:var(--soft);font-weight:700;margin:6px 0 0}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-140%);background:var(--ink);color:var(--sun);font-family:"Lilita One",sans-serif;font-size:22px;padding:10px 22px;border-radius:99px;z-index:40;transition:transform .35s cubic-bezier(.2,1.4,.4,1);white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
.burst{position:fixed;width:12px;height:12px;border-radius:3px;z-index:39;pointer-events:none;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
@media(prefers-reduced-motion:reduce){.burst{display:none}.toast{transition:none}.xpbar i{transition:none}}
details{margin-top:28px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px}
summary{font-weight:900;cursor:pointer;min-height:28px}
textarea{width:100%;min-height:90px;font:14px/1.4 monospace;border:2px solid var(--ink);border-radius:10px;padding:8px;margin-top:8px}
.mini{min-height:44px;padding:0 14px;border-radius:12px;border:2px solid var(--ink);font-weight:900;background:#fff;margin:8px 8px 0 0}
.sync{font-weight:800;font-size:13px}
.sync::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:#b9ad8a;margin-right:6px}
.sync[data-ok="1"]::before{background:#21867a}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

<header class="top">
  <div class="toprow">
    <h1>Álbum Gamer do Dudu<small>Descubra jogos novos e complete o álbum dos 5 mundos</small></h1>
    <div class="player"><div class="lvl" id="lvlNum">1</div><div><b id="lvlName">Novato</b><span id="xpNow">0 XP</span></div></div>
  </div>
  <div class="xpbar" aria-hidden="true"><i id="xpFill" style="width:0"></i></div>
  <div class="xptxt"><span id="xpLeft">Faltam 50 XP para o próximo nível</span><span id="cnt">0/79 figurinhas</span></div>
  <div class="xptxt"><span id="sync" class="sync">Conectando…</span></div>
</header>

<nav class="tabs" role="tablist">
  <button id="t-album" role="tab" aria-selected="true">Álbum</button>

<script>
{
const WORLDS={
  E:{n:'Reino da Estratégia',c:'#d62828',k:'Estratégia'},
  C:{n:'Cidade dos Construtores',c:'#e46c00',k:'Construção e gestão'},
  A:{n:'Ilha da Aventura',c:'#21867a',k:'Aventura e exploração'},
  L:{n:'Planeta Lego',c:'#1d4ed8',k:'Lego'},
  R:{n:'Laboratório do Raciocínio',c:'#b0189c',k:'Raciocínio'}
};
const RAW=[
['Age of Empires II: Definitive Edition','E','T (13+)','Comece com uma vila de camponeses e transforme ela num império com castelos, cavaleiros e catapultas antes que o inimigo derrube suas muralhas.','Batalhas medievais vistas de cima, sem sangue em close','Clássico do gênero, um dos mais bem avaliados da história','Avance sua civilização até a Idade dos Castelos.'],
['Age of Empires IV','E','T (13+)','Comande exércitos de verdade da Idade Média e descubra se você tem cabeça de general para vencer batalhas que mudaram a história.','Batalhas históricas, violência sem detalhes','Muito bem avaliado; campanhas com minidocumentários de história','Termine a primeira missão de uma campanha.'],
['Age of Mythology: Retold','E','T (13+)','Chame Zeus, Odin ou Rá para lançar raios, invocar ciclopes e soltar dragões no exército inimigo. Seus deuses dependem da sua estratégia.','Combates com monstros mitológicos, violência de fantasia','Remasterização muito bem recebida (2024)','Avance para a segunda era e escolha seu primeiro deus menor.'],
['Halo Wars 2','E','T (13+)','Comande tanques, naves e soldados numa guerra espacial em que vence quem pensa mais rápido, não quem atira melhor.','Guerra sci-fi vista de cima, sem sangue em close','Estratégia em tempo real feita para controle','Vença a primeira missão da campanha.'],
["Sid Meier's Civilization VI",'E','E10+ (10+)','Saia da Idade da Pedra e chegue ao foguete espacial. Cada escolha sua muda o rumo do mundo inteiro.','Guerras abstratas, sem cenas violentas; muita leitura','Série clássica; barato em promoção','Funde 3 cidades na mesma partida.'],
["Sid Meier's Civilization VII",'E','E10+ (10+)','Guie seu povo por três eras e decida se ele vai ser lembrado pela ciência, pela cultura ou pelas conquistas.','Guerras abstratas, sem cenas violentas; muita leitura','Versão mais nova (2025), partidas mais curtas','Chegue à segunda era com seu povo.'],
['Kingdom Two Crowns','E','E10+ (10+)','Você é um rei a cavalo com um saco de moedas. Durante o dia você constrói, à noite os monstros atacam.','Monstros cartunescos, nada sensível','Muito bem avaliado; dá para jogar em dupla','Sobreviva às 5 primeiras noites.'],
['Plants vs. Zombies: Replanted','E','E10+ (10+)','Plante girassóis, ervilhas atiradoras e melancias-catapulta para impedir que uma horda de zumbis trapalhões invada sua casa.','Zumbis cômicos, nada assustador','Clássico da defesa de torres, remasterizado','Termine o primeiro mundo do Modo Aventura.'],
['Bloons TD 6','E','E (confirmar)','Monte um exército de macacos com dardos, canhões e magia para estourar milhares de balões antes que eles atravessem o mapa.','Macacos estourando balões, zero violência','Um dos jogos de defesa de torres mais bem avaliados','Vença seu primeiro mapa inteiro.'],
['Minecraft Legends','E','E10+ (10+)','O mundo de Minecraft virou campo de batalha: lidere golens e aldeões para expulsar os piglins do Nether.','Combate cartunesco, sem sangue','Estratégia num universo que você já conhece','Liberte a primeira vila atacada pelos piglins.'],
['Northgard','E','T (13+)','Leve seu clã viking para uma ilha desconhecida e sobreviva a invernos brutais, lobos e clãs rivais.','Batalhas vikings sem detalhes de violência','Muito bem avaliado','Sobreviva ao primeiro inverno sem ninguém passar fome.'],
['SteamWorld Build','E','E10+ (10+)','Construa uma cidade de robôs no deserto e cave cada vez mais fundo atrás de tecnologia antiga. Cuidado com o que mora lá embaixo.','Robôs e monstros leves, nada sensível','Muito bem avaliado','Abra a entrada da mina.'],
['Two Point Hospital / Campus / Museum','C','E a E10+','Construa um hospital com doenças malucas, como cabeça de lâmpada, e tente não deixar o caos tomar conta.','Humor bobo, nada sensível','Série muito bem avaliada','Cure 20 pacientes (ou forme sua primeira turma).'],
['Planet Zoo','C','E (Livre)','Crie o zoológico dos seus sonhos, mas cuidado: se o leão ficar triste, ele foge.','Nada sensível','Referência em simulação de zoológico','Complete o primeiro cenário do modo Carreira.'],
['Planet Coaster 2','C','E (Livre)','Projete montanhas-russas e parques aquáticos tão radicais que a fila vai dar a volta no parque.','Nada sensível','Bem avaliado','Crie uma montanha-russa com nota de emoção acima de 5.'],
['Cities: Skylines','C','E (Livre)','Seja o prefeito de uma cidade inteira e descubra se você consegue acabar com o trânsito que nem os adultos resolvem.','Nada sensível; muitos números','Referência em construção de cidades','Chegue a 1.000 habitantes.'],
['Stardew Valley','C','E10+ (10+)','Herde uma fazenda abandonada, plante, pesque, explore minas cheias de tesouros e ajude a salvar a vila.','Há bebida alcoólica na taverna da vila; nada mais','Um dos jogos independentes mais amados da história','Colha e venda sua primeira plantação.'],
['Islanders: Console Edition','C','E (Livre)','Cada prédio vale pontos dependendo de onde você coloca: monte a ilha perfeita antes de ficar sem peças.','Nada sensível','Curto, relaxante e bem avaliado','Desbloqueie a segunda ilha.'],
['Microsoft Flight Simulator 2024','C','E (Livre)','Pilote aviões de verdade sobre o planeta inteiro. Dá até para sobrevoar a sua própria casa.','Nada sensível; exige paciência','Referência mundial em simulação de voo','Decole e pouse sem bater, no aeroporto que quiser.'],

}
function missao(){
  const a=active(),slots=[0,1,2].map(i=>{const g=a[i];return g?`<div class="slot full" style="--wc:${WORLDS[g.w].c}"><div><h3>${esc(g.n)}</h3><p style="margin:6px 0 0;font-weight:800">${WORLDS[g.w].n}</p></div><button class="go" data-open="${g.id}">Abrir figurinha</button></div>`:`<div class="slot">Vaga livre na missão.<br>Escolha um jogo no Álbum.</div>`}).join('');
  const pend=GAMES.filter(g=>st(g.id).t&&!st(g.id).d);
  view.innerHTML=`<div class="bar"><h2>Missão da semana</h2></div><p class="hint" style="margin:-4px 0 14px">Até 3 jogos por vez. Testou um, abre vaga para o próximo.</p><div class="slots">${slots}</div><div class="bar"><h2>Desafios esperando</h2></div>${pend.length?`<div class="list">${pend.map(g=>`<button class="row" data-open="${g.id}" style="--wc:${WORLDS[g.w].c}"><span class="dot"></span><b>${esc(g.n)}</b><span class="tag d">+50 XP</span></button>`).join('')}</div>`:'<div class="empty">Quando você testar um jogo, o desafio dele aparece aqui.</div>'}`;
}
function medalhas(){
  const on=medalsOn(),x=xpOf();
  view.innerHTML=`<div class="stats"><div class="stat"><b>${x}</b><span>XP total</span></div><div class="stat"><b>${tested().length}</b><span>jogos testados</span></div><div class="stat"><b>${GAMES.filter(g=>st(g.id).d).length}</b><span>desafios cumpridos</span></div><div class="stat"><b>${on.length}/${MEDALS.length}</b><span>medalhas</span></div></div><div class="medals">${MEDALS.map(m=>`<div class="medal${on.includes(m[0])?'':' off'}"><svg><use href="#medal"/></svg><h3>${m[0]}</h3><p>${m[1]}</p></div>`).join('')}</div>
  <details><summary>Como ganhar XP</summary><p>Colocar na missão: +5 · Testar: +20 · Primeiro jogo de um mundo: +30 · Cumprir o desafio: +50 · Avaliar: +10</p></details>
  <details><summary>Guardar o progresso (backup)</summary><p class="hint">O álbum fica salvo neste celular. Para não perder, copie o código e guarde. Para restaurar, cole o código e toque em Restaurar.</p><textarea id="bk" aria-label="Código de backup"></textarea><button class="mini" id="bkCopy">Copiar código</button><button class="mini" id="bkLoad">Restaurar</button><p class="hint" id="bkMsg"></p></details>`;
  document.getElementById('bk').value=btoa(unescape(encodeURIComponent(JSON.stringify(S.g))));
}
const ACT={missao:'colocou na missão',testou:'testou',desafio:'cumpriu o desafio',avaliou:'avaliou',desfez:'desfez'};
function pai(){
  const w=Object.keys(WORLDS).map(k=>{const all=GAMES.filter(g=>g.w===k),t=all.filter(g=>st(g.id).t).length;return `<div class="row" style="--wc:${WORLDS[k].c}"><span class="dot"></span><b>${WORLDS[k].n}</b><span class="tag">${t}/${all.length}</span></div>`}).join('');
  const ev=events===null?'<div class="empty">Não consegui carregar o histórico. Confira a conexão e toque em Atualizar.</div>':events.length?`<div class="list">${events.map(e=>{const g=BYID[e.game_id];const d=new Date(e.created_at);return `<div class="row" style="--wc:${g?WORLDS[g.w].c:'#888'}"><span class="dot"></span><b>${esc(g?g.n:e.game_id)}</b><span class="tag">${esc(ACT[e.action]||e.action)}${e.value?' · '+esc(e.value):''}</span><span class="hint" style="margin:0;white-space:nowrap">${d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})} ${d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span></div>`}).join('')}</div>`:'<div class="empty">Nada registrado ainda.</div>';
  view.innerHTML=`<div class="bar"><h2>Painel do pai</h2><button class="chip" id="evRefresh">Atualizar</button></div><div class="stats"><div class="stat"><b>${xpOf()}</b><span>XP</span></div><div class="stat"><b>${tested().length}</b><span>testados</span></div><div class="stat"><b>${GAMES.filter(g=>st(g.id).d).length}</b><span>desafios</span></div><div class="stat"><b>${new Set(tested().map(g=>g.w)).size}/5</b><span>mundos</span></div></div><div class="list">${w}</div><div class="bar"><h2>Histórico</h2></div>${ev}`;
}
function render(){header();if(S.tab==='pai'&&!IS_DAD)S.tab='album';({album,missao,medalhas,pai})[S.tab]();for(const t of ['album','missao','medalhas','pai']){const b=document.getElementById('t-'+t);if(b)b.setAttribute('aria-selected',S.tab===t)}}
const ov=document.getElementById('ov'),sheet=document.getElementById('sheet');
let openId=null;
function openSheet(id){
  openId=id;const g=BYID[id],s=st(id),w=WORLDS[g.w],full=active().length>=3&&!s.m;
  sheet.innerHTML=`<div class="shead" style="--wc:${w.c}"><button class="x" data-close aria-label="Fechar">×</button><svg><use href="#w-${g.w}"/></svg><h2 id="sTitle">${esc(g.n)}</h2><p>${w.n}</p></div><div class="sbody"><p class="pitch">${esc(g.p)}</p><dl class="info"><dt>Classificação</dt><dd>${esc(g.r)}</dd><dt>Conteúdo</dt><dd>${esc(g.c)}</dd><dt>Destaque</dt><dd>${esc(g.h)}</dd></dl><div class="chal"><b>Desafio · +50 XP</b>${esc(g.d)}</div><div class="acts">
  <button class="big${s.m?' on':''}" data-act="m" ${full||s.t?'disabled':''}>${s.t?'Já testado':s.m?'Na missão (toque para tirar)':full?'Missão cheia: teste um jogo antes':'Colocar na missão · +5 XP'}</button>
  <button class="big${s.t?' on':''}" data-act="t">${s.t?'Testei! (toque para desfazer)':'Testei! Colar figurinha · +20 XP'}</button>
  <button class="big${s.d?' on':''}" data-act="d" ${s.t?'':'disabled'}>${s.d?'Desafio cumprido! (desfazer)':'Cumpri o desafio · +50 XP'}</button>
  ${s.t?`<p class="hint" style="margin:4px 0 0">O que você achou? · +10 XP</p><div class="rate">${['Amei','Curti','Não curti'].map(r=>`<button data-rate="${r}" aria-pressed="${s.r===r}">${r}</button>`).join('')}</div>`:''}
  <a class="store" href="https://www.xbox.com/pt-BR/search?q=${encodeURIComponent(g.n.replace(/\s*\(.*\)/,''))}" target="_blank" rel="noopener">Ver no Xbox e no Game Pass</a>
  </div></div>`;
  ov.classList.add('on');sheet.scrollTop=0;sheet.querySelector('.x').focus();
}
function closeSheet(){ov.classList.remove('on');openId=null;render()}
const toast=document.getElementById('toast');let tt;
function say(msg){toast.textContent=msg;toast.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('on'),1700)}
function burst(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const cs=['#d62828','#e46c00','#21867a','#1d4ed8','#b0189c','#ffcf33'];for(let i=0;i<26;i++){const b=document.createElement('i');b.className='burst';b.style.left='50%';b.style.top='40%';b.style.background=cs[i%cs.length];const a=Math.random()*Math.PI*2,r=120+Math.random()*160;b.style.setProperty('--dx',Math.cos(a)*r+'px');b.style.setProperty('--dy',Math.sin(a)*r+'px');document.body.appendChild(b);setTimeout(()=>b.remove(),1100)}}
function change(fn,ev){
  const x0=xpOf(),l0=lvlOf(x0),m0=medalsOn();fn();save();push(ev);
  const x1=xpOf(),l1=lvlOf(x1),m1=medalsOn().filter(m=>!m0.includes(m));
  if(l1>l0){say('Subiu de nível: '+LEVELS[l1][1]+'!');burst()}
  else if(m1.length){say('Nova medalha: '+m1[0]+'!');burst()}
  else if(x1>x0)say('+'+(x1-x0)+' XP');
  header();openSheet(openId);
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-close]');
  if(e.target===ov){closeSheet();return}
  if(!t)return;
  if(t.matches('[data-close]')){closeSheet();return}
  if(t.dataset.open){openSheet(t.dataset.open);return}
  if(t.dataset.world){S.world=t.dataset.world;save();render();return}
  if(t.dataset.age){S.age=t.dataset.age;save();render();return}
  if(t.id&&t.id.startsWith('t-')){S.tab=t.id.slice(2);save();render();window.scrollTo(0,0);return}
  if(t.dataset.act&&openId){const k=t.dataset.act,on=!st(openId)[k],names={m:'missao',t:'testou',d:'desafio'};change(()=>{const s=S.g[openId]=Object.assign({},st(openId));s[k]=s[k]?0:1;if(k==='t'&&!s.t){s.d=0;s.r=null}if(k==='t'&&s.t)s.m=1},[openId,on?names[k]:'desfez',on?null:names[k]]);return}
  if(t.dataset.rate&&openId){const v=st(openId).r===t.dataset.rate?null:t.dataset.rate;change(()=>{const s=S.g[openId]=Object.assign({},st(openId));s.r=v},[openId,'avaliou',v||'sem nota']);return}
  if(t.id==='evRefresh'){loadEvents();return}
  if(t.id==='bkCopy'){const v=document.getElementById('bk').value;navigator.clipboard?.writeText(v).then(()=>document.getElementById('bkMsg').textContent='Código copiado.').catch(()=>{document.getElementById('bk').select();document.getElementById('bkMsg').textContent='Selecione o código e copie.'});return}
  if(t.id==='bkLoad'){try{const g=JSON.parse(decodeURIComponent(escape(atob(document.getElementById('bk').value.trim()))));if(typeof g!=='object'||!g)throw 0;S.g=g;save();render();say('Álbum restaurado!')}catch(err){document.getElementById('bkMsg').textContent='Código inválido. Confira se copiou inteiro.'}return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ov.classList.contains('on'))closeSheet()});
if(IS_DAD){const b=document.createElement('button');b.id='t-pai';b.setAttribute('role','tab');b.textContent='Pai';document.querySelector('.tabs').appendChild(b)}
render();pull().then(()=>{if(IS_DAD)loadEvents()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){pull();if(IS_DAD)loadEvents()}});
}
</script>
</body>
</html>
